spring.application.name=crud-produtos-api

# Porta: o Render informa a variavel PORT; localmente usa 8081.
server.port=${PORT:8081}

# Banco: PostgreSQL via variaveis de ambiente. Sem elas, usa H2 em memoria (teste rapido).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:produtos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Cria/atualiza a tabela produto automaticamente a partir da entidade.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origens liberadas no CORS (ex.: http://localhost:8080,https://meu-front.onrender.com)
app.cors.origins=${CORS_ORIGINS:*}